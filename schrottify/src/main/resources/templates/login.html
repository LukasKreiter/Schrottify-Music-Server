<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - Schrottify</title>
</head>
<body>
<main>
    <h1>Sign in to Schrottify</h1>

    <p th:if="${loginError}" role="alert">Invalid username or password.</p>
    <p th:if="${loggedOut}">You have been signed out.</p>

    <form th:action="@{/login}" method="post">
        <div>
            <label for="username">Navidrome username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
